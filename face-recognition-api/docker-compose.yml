version: '3.8'

services:
  api:
    build: ./face-recognition-api
    ports:
      - "5000:5000"
    volumes:
      - enrolled_data:/workspace
    command: python app.py

  ui:
    build: ./face-recognition-api
    ports:
      - "7860:7860"
    depends_on:
      - api
    command: python gradio_app.py
    environment:
      - API_BASE=http://api:5000

volumes:
  enrolled_data: